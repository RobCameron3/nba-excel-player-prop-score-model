           keyTimes="0;.4;1"
           dur="9s" repeatCount="indefinite"/>
  <animate attributeName="y"
           values="928;795;795"
           keyTimes="0;.4;1"
           dur="9s" repeatCount="indefinite"/>
</rect>

<rect x="340" y="815" width="92" height="113"
      rx="6" fill="url(#blue)">
  <animate attributeName="height"
           values="0;113;113"
           keyTimes="0;.45;1"
           dur="9s" repeatCount="indefinite"/>
  <animate attributeName="y"
           values="928;815;815"
           keyTimes="0;.45;1"
           dur="9s" repeatCount="indefinite"/>
</rect>

<rect x="490" y="849" width="92" height="79"
      rx="6" fill="url(#blue)">
  <animate attributeName="height"
           values="0;79;79"
           keyTimes="0;.5;1"
           dur="9s" repeatCount="indefinite"/>
  <animate attributeName="y"
           values="928;849;849"
           keyTimes="0;.5;1"
           dur="9s" repeatCount="indefinite"/>
</rect>

<rect x="640" y="915" width="92" height="13"
      rx="6" fill="url(#blue)">
  <animate attributeName="height"
           values="0;13;13"
           keyTimes="0;.55;1"
           dur="9s" repeatCount="indefinite"/>
  <animate attributeName="y"
           values="928;915;915"
           keyTimes="0;.55;1"
           dur="9s" repeatCount="indefinite"/>
</rect>

<g fill="#ffffff" font-size="17" font-weight="bold"
   text-anchor="middle">
  <text x="236" y="786">80%</text>
  <text x="386" y="806">68%</text>
  <text x="536" y="840">48%</text>
  <text x="686" y="906">8%</text>
</g>

<g fill="#ffffff" font-size="15" text-anchor="middle">
  <text x="236" y="949">10+ PTS</text>
  <text x="386" y="949">15+ PTS</text>
  <text x="536" y="949">20+ PTS</text>
  <text x="686" y="949">40+ PTS</text>
</g>

<!-- INJURY AND EXCEL WORKFLOW -->
<rect x="863" y="685" width="512" height="280"
      rx="16" class="panel"/>

<text x="885" y="722" class="heading" font-size="22">
  INJURY-ADJUSTED EXCEL MODEL
</text>

<text x="885" y="747" class="muted" font-size="14">
  Automated roster changes and statistical updates
</text>

<rect x="885" y="770" width="470" height="49"
      rx="8" fill="#102a41" stroke="#547f9f"/>

<text x="905" y="800" fill="#ffffff"
      font-size="17" font-weight="bold">
  CBS SPORTS INJURY REPORT
</text>

<rect x="885" y="834" width="470" height="49"
      rx="8" fill="#102a41" stroke="#547f9f"/>

<text x="905" y="864" fill="#ffffff"
      font-size="17" font-weight="bold">
  POWER QUERY + ROSTER ADJUSTMENT
</text>

<rect x="885" y="898" width="470" height="49"
