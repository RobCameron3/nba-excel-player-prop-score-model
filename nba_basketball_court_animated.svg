<!-- ANIMATED WORKFLOW INDICATORS -->
<g fill="#7ef5b9">
  <circle cx="1327" cy="794" r="6">
    <animate attributeName="opacity"
             values=".2;1;.2"
             dur="3s" repeatCount="indefinite"/>
  </circle>

  <circle cx="1327" cy="858" r="6">
    <animate attributeName="opacity"
             values=".2;1;.2"
             begin="1s"
             dur="3s" repeatCount="indefinite"/>
  </circle>

  <circle cx="1327" cy="922" r="6">
    <animate attributeName="opacity"
             values=".2;1;.2"
             begin="2s"
             dur="3s" repeatCount="indefinite"/>
  </circle>
</g>

<!-- FOOTNOTE -->
<text x="28" y="989" fill="#9ab8cd" font-size="11">
  Illustrative probabilities shown for demonstration. Actual predictions depend on refreshed player data, injury reports, and selected matchups.
</text>

</svg>
